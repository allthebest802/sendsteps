<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Helpset: SEND Toolkit</title>
  <meta name="description" content="A calm set of offline-first tools for children with additional needs — timers, now &amp; next boards, choice boards and more, in one place." />

  <!-- One manifest for the whole toolkit -> one TWA -> one Amazon listing -->
  <link rel="manifest" href="/app/manifest.webmanifest" />
  <meta name="theme-color" content="#157A4C" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Self-hosted fonts (bundled + precached) so the app is fully offline -->
  <link rel="stylesheet" href="/app/fonts/fonts.css" />

  <link rel="stylesheet" href="/app/shared/ui.css" />
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>

  <header class="app-bar">
    <a class="app-bar__home" href="#/" aria-label="Helpset home">
      <span class="app-bar__mark" aria-hidden="true">🌿</span>
      <span class="app-bar__name">Helpset</span>
    </a>
    <!-- The back-to-tools link only shows when you're inside a tool (see router.js) -->
    <a class="app-bar__back" href="#/" hidden>‹ All tools</a>
  </header>

  <main id="app" tabindex="-1"><!-- tools + hub render in here --></main>

  <!-- Router is a module; it lazy-loads each tool only when opened -->
  <script type="module" src="/app/shared/router.js"></script>

  <!-- One service worker for the whole app, scoped to /app/.
       Updates apply on the next app launch — no in-app banner. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('/app/sw.js', { scope: '/app/' })
          .catch(err => console.warn('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
